  function safePayload(raw){
    if(!raw||raw.kind!=='caizo_safe_aggregate_v1'||typeof raw.dataset_version!=='string'||!raw.totals||!Array.isArray(raw.groups)||!raw.issueRating)return false;
    const allowedTop=new Set(['kind','dataset_version','audit_date','timeframe','source_last_checked_at','data_last_changed_at','last_successful_processing_at','provenance','totals','days','groups','issueRating','qa','taxonomy','problemAll','agentStats']);
    if(Object.keys(raw).some(k=>!allowedTop.has(k)))return false;
    const allowedGroup=new Set(['id','label','known','issueYes','issueNo','color','grouped']);
    if(raw.groups.some(g=>Object.keys(g).some(k=>!allowedGroup.has(k))))return false;
    if(!['source_last_checked_at','data_last_changed_at','last_successful_processing_at'].every(k=>typeof raw[k]==='string'&&!Number.isNaN(new Date(raw[k]).getTime())))return false;
    // Allowlist public schema. This is defense in depth, not a replacement for SERVER-SIDE privacy review.
    const forbiddenKeys=/^(phone|phone_number|customer_name|comment|comments|raw|order_date|timestamp|row|rows|record_id)$/i;
    function forbidden(obj,depth=0){if(!obj||typeof obj!=='object'||depth>9)return false;return Object.entries(obj).some(([key,val])=>forbiddenKeys.test(key)||forbidden(val,depth+1))}
    if(forbidden(raw))return false;
    if(raw.agentStats!==undefined&&raw.agentStats!==null){
      if(!Array.isArray(raw.agentStats)||raw.agentStats.length>60)return false;
      const safeAgentFields=new Set(['name','attempts','reached','nr','other','feedback','issues','noIssues','ratingExcludedNR','highRating','suppressed']);
      if(raw.agentStats.some(a=>!a||Object.keys(a).some(k=>!safeAgentFields.has(k))||typeof a.name!=='string'||a.name.length>90||!Number.isSafeInteger(a.attempts)||a.attempts<20))return false;
      if(raw.agentStats.some(a=>['reached','nr','other','feedback','issues','noIssues','ratingExcludedNR','highRating'].some(k=>a[k]!==null&&a[k]!==undefined&&(!Number.isSafeInteger(a[k])||a[k]<0))))return false;
      if(raw.agentStats.some(a=>a.reached!=null&&a.nr!=null&&a.other!=null&&a.reached+a.nr+a.other!==a.attempts))return false;
      if(raw.agentStats.some(a=>a.feedback!=null&&a.feedback>a.attempts))return false;
    }

    const nums=['followups','answerYes','answerNo','feedbackKnown','problemYes','problemNo','nrWithinYes','highRating','highAmongIssues'];
    if(nums.some(k=>!Number.isSafeInteger(raw.totals[k])||raw.totals[k]<0))return false;
    if(raw.groups.some(g=>typeof g.id!=='string'||typeof g.label!=='string'||!['known','issueYes','issueNo'].every(k=>Number.isSafeInteger(g[k])&&g[k]>=5)||g.issueYes+g.issueNo!==g.known||g.known<20))return false;
    // Require internally consistent marginal totals. Reject changes with incompatible schema or small safe cells.
    if(raw.groups.reduce((a,g)=>a+g.known,0)!==raw.totals.feedbackKnown)return false;
    if(raw.groups.reduce((a,g)=>a+g.issueYes,0)!==raw.totals.problemYes)return false;
    if(raw.groups.reduce((a,g)=>a+g.issueNo,0)!==raw.totals.problemNo)return false;
    if(!['yes','no'].every(k=>raw.issueRating[k]&&['high','other'].every(v=>Number.isSafeInteger(raw.issueRating[k][v])&&raw.issueRating[k][v]>=5)))return false;
    if(raw.issueRating.yes.high+raw.issueRating.yes.other!==raw.totals.problemYes||raw.issueRating.no.high+raw.issueRating.no.other!==raw.totals.problemNo)return false;
    // Accept only this approved aggregate group layout until private re-identification review of new groupings.
    if(raw.groups.length!==DATA.groups.length||raw.groups.some((g,i)=>g.id!==DATA.groups[i].id))return false;
    if(!Array.isArray(raw.days)||raw.days.some(d=>typeof d.label!=='string'||!Number.isSafeInteger(d.count)||d.count<5)||raw.days.reduce((sum,d)=>sum+d.count,0)!==raw.totals.followups)return false;
    if(!raw.problemAll||!['yes','no','nr'].every(k=>Number.isSafeInteger(raw.problemAll[k])&&raw.problemAll[k]>=5)||raw.problemAll.yes+raw.problemAll.no+raw.problemAll.nr!==raw.totals.followups)return false;
    if(!raw.qa||Object.keys(DATA.qa).some(key=>!Number.isSafeInteger(raw.qa[key])||raw.qa[key]<0))return false;
    if(raw.totals.answerYes+raw.totals.answerNo!==raw.totals.followups||raw.totals.problemYes+raw.totals.problemNo!==raw.totals.feedbackKnown||raw.totals.highRating!==raw.issueRating.yes.high+raw.issueRating.no.high)return false;
    return true;
  }

        [/^(\d[\d,.]*) known \/ (\d[\d,.]*) recorded Yes$/,(_,a,b)=>`${a} معروفة / ${b} إجابة نعم مسجلة`],
        [/^(\d[\d,.]*) issue records \/ (\d[\d,.]*) eligible$/,(_,a,b)=>`${a} مشكلة / ${b} سجل مؤهل`],
        [/^(\d[\d,.]*) of (\d[\d,.]*) selected eligible records$/,(_,a,b)=>`${a} من أصل ${b} سجلات مؤهلة`],
        [/^(\d[\d,.]*) known-status records in this chart context · (.+) · Ctrl\/Cmd-click to combine$/,(_,a,b)=>`${a} سجلاً بحالة معروفة · ${AR_TEXT[b]||b} · Ctrl / Cmd لتعدد الاختيار`],
        [/^(\d[\d,.]*) scoped known-status responses$/,(_,a)=>`${a} رداً مؤهلاً في النطاق`],
        [/^(\d[\d,.]*) comments match · (\d[\d,.]*) comments loaded · .+$/,(_,a,b)=>`${a} تعليق مطابق · ${b} تعليق محمّل · تم إخفاء بيانات الاتصال الواضحة`],
        [/^Rating: (.+)$/,(_,a)=>`التقييم: ${a}`],
        [/^Among (\d[\d,.]*) answered records with known problem status\..+$/,(_,a)=>`من أصل ${a} رداً بحالة مشكلة معروفة. التقييمات المسجلة أولية وقد تتضمن قيماً غير صالحة.`],
        [/^([\d.]+)% of all (.+)$/,(_,a,b)=>`${a}٪ من إجمالي ${AR_TEXT[b]||b}`],
        [/^([\d.]+)% of (.+)$/,(_,a,b)=>`${a}٪ من ${AR_TEXT[b]||b}`],
        [/^(\d[\d,.]*) answered records with known problem status\.$/,(_,a)=>`${a} إجابة بحالة مشكلة معروفة.`],
        [/^(\d[\d,.]*) of (\d[\d,.]*) in scope$/,(_,a,b)=>`${a} من أصل ${b} في النطاق`],
        [/^of (\d[\d,.]*) issue Yes$/,(_,a)=>`من أصل ${a} مشكلة نعم`],
        [/^of (\d[\d,.]*) issue No$/,(_,a)=>`من أصل ${a} مشكلة لا`],
        [/^\d+ of all issue-Yes eligible records$/,()=>`من سجلات المشكلات المؤهلة`],
      ];
      for(const [re,fn] of rules){if(re.test(val)){translated=val.replace(re,fn);break}}
    }
    if(!translated)return src;
    return src.replace(val,translated);
  }
  function localizePage(){
    const ar=uiLanguage==='ar';document.documentElement.lang=uiLanguage;document.documentElement.dir=ar?'rtl':'ltr';
    const switcher=document.getElementById('languageButton');switcher.innerHTML=ar?'EN <span class="lang-divider">/</span> English':'العربية <span class="lang-divider">/</span> AR';
    switcher.setAttribute('aria-label',ar?'Switch dashboard to English':'التبديل إلى اللغة العربية');switcher.title=ar?'Switch to English':'التبديل إلى العربية';
    const root=document.body,w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
    while(node=w.nextNode()){
      if(!node.parentElement||node.parentElement.closest('script,style,.language-btn,.customer-comment-text'))continue;
      if(!savedText.has(node))savedText.set(node,node.nodeValue);
      const original=savedText.get(node);node.nodeValue=ar?translateText(original):original;
    }
    for(const el of root.querySelectorAll('[title],[aria-label],[placeholder]')){
      if(el.closest('.language-btn,.customer-comment-text'))continue;
      if(!savedAttrs.has(el))savedAttrs.set(el,{});
      const orig=savedAttrs.get(el);
      for(const attr of ['title','aria-label','placeholder']){
        if(!el.hasAttribute(attr))continue;
        if(!Object.hasOwn(orig,attr))orig[attr]=el.getAttribute(attr);
        el.setAttribute(attr,ar?translateText(orig[attr]):orig[attr]);
      }
    }
    document.title=(ar?(AR_TEXT[NAV.find(n=>n[0]===state.page)[1]]||'لوحة تجربة العملاء'):NAV.find(n=>n[0]===state.page)[1])+' | CAIZO';
  }
  document.getElementById('languageButton').addEventListener('click',()=>{
    uiLanguage=uiLanguage==='en'?'ar':'en';
    try{localStorage.setItem('caizo-language',uiLanguage)}catch{}
    const u=new URL(location.href);u.searchParams.set('lang',uiLanguage);
    try{history.replaceState(null,'',u.pathname+u.search+u.hash)}catch{}
    render();paintStatus();
  });

  loadURL();render();paintStatus();loadApprovedComments();if(location.protocol!=='file:')checkSafeEndpoint(false);
  </script>
